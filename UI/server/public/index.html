<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Log Monitor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-group">
                <h1>ESP32 Telemetry Dashboard</h1>
                <p class="subtitle">UDP Port 54321</p>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-target="tab-main">Main Logs</button>
                <button class="tab-btn" data-target="tab-adc">ADC Chart</button>
                <button class="tab-btn" data-target="tab-motor">Motor Control</button>
                <button class="tab-btn" data-target="tab-tuning">Live Tuning</button>
            </div>

            <div class="status-indicator">
                <div id="status-dot" class="dot red"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>
        
        <div class="controls">
            <button id="btn-connect" class="btn primary">Connect</button>
            <button id="btn-disconnect" class="btn danger">Disconnect</button>
            <button id="btn-clear" class="btn secondary">Clear Log</button>
            
            <label class="toggle">
                <input type="checkbox" id="toggle-autoscroll" checked>
                <span>Auto-scroll (Main Tab)</span>
            </label>
        </div>

        <div class="content-area">
            <!-- Main Tab (Logs) -->
            <div id="tab-main" class="tab-content active">
                <div class="log-container" id="log-container">
                    <ul id="log-list"></ul>
                </div>
            </div>

            <!-- ADC Tab (Charts) -->
            <div id="tab-adc" class="tab-content">
                <div class="chart-container">
                    <canvas id="adc-chart"></canvas>
                </div>
            </div>

            <!-- Motor Tab -->
            <div id="tab-motor" class="tab-content">
                <div id="motor-container" class="motor-container">
                    <!-- Managed by motorManager.js -->
                </div>
            </div>

            <!-- Live Tuning Tab -->
            <div id="tab-tuning" class="tab-content">
                <div class="tuning-container">
                    <div class="tuning-grid">
                        
                        <!-- Left Motor Tuning -->
                        <div class="tuning-card">
                            <h3>Left Motor</h3>
                            <div class="tuning-row header">
                                <span>Param</span>
                                <span>Active</span>
                                <span>New</span>
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kp</span>
                                <span class="tuning-active" id="active-kp-l">0.000</span>
                                <input type="number" id="input-kp-l" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Ki</span>
                                <span class="tuning-active" id="active-ki-l">0.000</span>
                                <input type="number" id="input-ki-l" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kd</span>
                                <span class="tuning-active" id="active-kd-l">0.000</span>
                                <input type="number" id="input-kd-l" step="0.001" value="0.000">
                            </div>
                        </div>

                        <!-- Right Motor Tuning -->
                        <div class="tuning-card">
                            <h3>Right Motor</h3>
                            <div class="tuning-row header">
                                <span>Param</span>
                                <span>Active</span>
                                <span>New</span>
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kp</span>
                                <span class="tuning-active" id="active-kp-r">0.000</span>
                                <input type="number" id="input-kp-r" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Ki</span>
                                <span class="tuning-active" id="active-ki-r">0.000</span>
                                <input type="number" id="input-ki-r" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kd</span>
                                <span class="tuning-active" id="active-kd-r">0.000</span>
                                <input type="number" id="input-kd-r" step="0.001" value="0.000">
                            </div>
                        </div>

                        <!-- Line Tracker Tuning -->
                        <div class="tuning-card">
                            <h3>Line Tracker</h3>
                            <div class="tuning-row header">
                                <span>Param</span>
                                <span>Active</span>
                                <span>New</span>
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kp</span>
                                <span class="tuning-active" id="active-kp-t">0.000</span>
                                <input type="number" id="input-kp-t" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Ki</span>
                                <span class="tuning-active" id="active-ki-t">0.000</span>
                                <input type="number" id="input-ki-t" step="0.001" value="0.000">
                            </div>
                            <div class="tuning-row">
                                <span class="tuning-label">Kd</span>
                                <span class="tuning-active" id="active-kd-t">0.000</span>
                                <input type="number" id="input-kd-t" step="0.001" value="0.000">
                            </div>
                        </div>

                    </div>
                    
                    <div class="tuning-actions">
                        <button id="btn-tune-test" class="btn primary btn-large">Test Tune</button>
                        <button id="btn-tune-save" class="btn danger btn-large">Save to Flash</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
